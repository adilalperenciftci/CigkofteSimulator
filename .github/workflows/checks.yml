name: Source checks

# A full Unreal build takes far too long on a free runner and needs the engine
# installed. This workflow looks instead at what the compiler does not catch:
# file encoding, header hygiene, and the schema integrity of the balance CSVs.
# The editor build runs locally - see "Building it" in the README.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Do not rename this job. It is the required status check on master, and
  # renaming it silently leaves the branch with no required check at all.
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sources and balance data
        run: python Tools/check_sources.py

      - name: Line endings
        # .gitattributes says LF in the repository. A file committed with CRLF
        # shows up as un-normalised to git and is caught here.
        run: |
          if git ls-files --eol | grep -E 'i/crlf|i/mixed'; then
            echo "::error::A file in the repository has CRLF or mixed line endings (.gitattributes expects LF)."
            exit 1
          fi
          echo "Line endings are clean."
