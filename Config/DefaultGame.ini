; The cat. ACigCat::TrySetupSkeletalCat returns early when the pack is absent
; and the primitive cat stands in, without so much as a warning - the quietest
; version of this defect in the project, and the one the static check found
; rather than a person. The two folders are 123 MB, which is the whole pack.
+DirectoriesToAlwaysCook=(Path="/Game/Cat_Animation_Pack/Demo/Cat_Model")
+DirectoriesToAlwaysCook=(Path="/Game/Cat_Animation_Pack/Animation")

; The shop fittings. One pack for every station so the counter, the shelf and
