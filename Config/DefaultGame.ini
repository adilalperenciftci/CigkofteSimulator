; ------------------------------------------------------------- asset manager
; There is deliberately no GameFeatureData rule here.
;
; One was added to silence a Game Features startup message, declaring the type
; against /Script/GameFeatures.GameFeatureData. The GameFeatures plugin is not
; enabled by this project, so that class cannot be loaded - and the asset manager
; ensures rather than shrugging when a declared type's base class is missing.
; During a cook that ensure is an error, and the cook fails: "Failed to load class
; /Script/GameFeatures.GameFeatureData for Primary Asset Type GameFeatureData".
;
; It went unnoticed because it does not reproduce on a machine whose .uproject
; enables extra editor plugins that pull the GameFeatures module in - the class
; resolves there and the rule behaves. On the committed plugin list, which is what
; anyone cloning this repository packages with, the cook cannot complete.
;
; Declaring a type whose class the project does not ship is the defect. The
; alternative fix - enabling the GameFeatures plugin - would add a runtime plugin
; to the shipped game to satisfy a rule that exists only to quieten a log line.
