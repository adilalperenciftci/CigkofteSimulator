+DirectoriesToAlwaysCook=(Path="/Game/Scene_Bazaar_Vol1/Assets/MS/3D/His_Baz_Food_Spice_Chilli_Red_01")
+DirectoriesToAlwaysCook=(Path="/Game/Scene_Bazaar_Vol1/Assets/MS/3D/His_Baz_Food_Spice_Turmeric_Pile_01")
+DirectoriesToAlwaysCook=(Path="/Game/Scene_Bazaar_Vol1/Assets/MS/3D/His_Baz_Food_Spice_Powder_Pile_01")
+DirectoriesToAlwaysCook=(Path="/Game/Scene_Bazaar_Vol1/Assets/MS/3D/Food_Vegetable_Zucchini_Fresh_01")
