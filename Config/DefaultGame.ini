[/Script/UnrealEd.ProjectPackagingSettings]
; ---------------------------------------------------------------- data files
; The balance tables, the text table and the dialogue lines are read from disk
; at runtime through FPaths::ProjectDir(). Nothing references them as assets, so
; without this the packaged build stages none of them: every balance CSV falls
; back to its C++ default and the UI shows raw keys like "msg.customer.served"
; instead of sentences. That is exactly what the first packaged build did.
;
; Staged as non-UFS, i.e. loose files rather than inside the pak, on purpose.
; The whole point of moving this data out of code was that it can be retuned
; without a rebuild, and the CigReloadBalance console command exists to do it
; live - both of which stop working the moment the files are sealed in a pak.
; The paths are resolved relative to Content/, not to the project root - UAT
; answers a plain "Config/Balance" with "Unable to find directory
; .../Content/Config/Balance" and carries on to a successful build with the data
; missing. Hence the ../ .
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Config/Balance")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Config/Text")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Config/Dialogue")

; ------------------------------------------------------------------- assets
; Sounds and meshes are resolved by path at runtime (LoadObject in
; CigAudioSubsystem and CigWorldBuilder), so the cooker sees no reference to
; them and leaves them out. The first packaged build had no audio at all - not
; a single UI click, and none of the ambience beds.
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/LowPoly")
