; ---------------------------------------------------------------- data files
; The balance tables, the text table and the dialogue lines are read from disk
; at runtime through FPaths::ProjectDir(). Nothing references them as assets, so
; without this the packaged build stages none of them: every balance CSV falls
; back to its C++ default and the UI shows raw keys like "msg.customer.served"
; instead of sentences. That is exactly what the first packaged build did.
;
; Staged as non-UFS, i.e. loose files rather than inside the pak, on purpose.
; The whole point of moving this data out of code was that it can be retuned
; without a rebuild, and the CigReloadBalance console command exists to do it
; live - both of which stop working the moment the files are sealed in a pak.
; The paths are resolved relative to Content/, not to the project root - UAT
; answers a plain "Config/Balance" with "Unable to find directory
; .../Content/Config/Balance" and carries on to a successful build with the data
; missing. Hence the ../ .
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Config/Balance")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Config/Text")
+DirectoriesToAlwaysStageAsNonUFS=(Path="../Config/Dialogue")

; ------------------------------------------------------------------- assets
; Sounds and meshes are resolved by path at runtime (LoadObject in
; CigAudioSubsystem and CigMeshLibrary), so the cooker sees no reference to
; them and leaves them out. The first packaged build had no audio at all - not
; a single UI click, and none of the ambience beds.
;
; Every folder the runtime can ask for must be listed here. Tools/check_sources.py
; enforces that against the paths in the source, because the failure is quiet:
; the loader returns nullptr, the caller falls back to a primitive, and the game
; runs and boots and passes its smoke test with the shop rendered as grey boxes.
; That is how the mesh packs below were missed when the sounds were fixed.
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/LowPoly")

; Named per requested subfolder rather than per pack, and not out of tidiness.
; These are Megascans-grade source packs: Scene_Bazaar_Vol1 alone is 6.1 GB on
; disk and CityPark 574 MB, against the four folders each that the game actually
; asks for. Cooking the pack roots would add several gigabytes of props nothing
; ever spawns to a demo that is currently 924 MB. dukkan/Geometries is flat, so
; it goes in whole - 290 MB, and there is no narrower honest answer.
;
; Adding a new CigMesh::Park/Bazaar/LoadAt call site means adding its folder here.
+DirectoriesToAlwaysCook=(Path="/Game/dukkan/Geometries")
+DirectoriesToAlwaysCook=(Path="/Game/CityPark/Meshes/Buildings")
+DirectoriesToAlwaysCook=(Path="/Game/CityPark/Meshes/Flora/Trees")
+DirectoriesToAlwaysCook=(Path="/Game/CityPark/Meshes/ParkSquare")
+DirectoriesToAlwaysCook=(Path="/Game/CityPark/Meshes/Props")
+DirectoriesToAlwaysCook=(Path="/Game/Scene_Bazaar_Vol1/Assets/MS/3D/His_Baz_Container_Basket_Jute_Woven_01")
+DirectoriesToAlwaysCook=(Path="/Game/Scene_Bazaar_Vol1/Assets/MS/3D/His_Baz_Sack_Jute_Closed_01")
+DirectoriesToAlwaysCook=(Path="/Game/Scene_Bazaar_Vol1/Assets/MS/3D/His_Baz_Stall_Frame_Wood_02")
+DirectoriesToAlwaysCook=(Path="/Game/Scene_Bazaar_Vol1/Assets/MS/3D/His_Baz_Storage_Crate_Wood_M_01")

; The market stall produce, from the FBazaarGood table in BuildBazaar. Three of
